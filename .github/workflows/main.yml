name: Frontend CI with Playwright

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1️⃣ Checkout frontend repo
      - name: Checkout Frontend Repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install frontend dependencies
      - name: Install Frontend Dependencies
        run: npm install

      # 4️⃣ Build frontend
      - name: Build Frontend
        run: npm run build

      # 5️⃣ Start frontend server
      - name: Start Frontend Server
        run: |
          npm run dev &
          npx wait-on http://localhost:5004 --timeout 120000
        shell: bash

      # 6️⃣ Clone Playwright Test Repo
      - name: Clone Playwright Test Repo
        run: git clone https://github.com/Anik-006/nifty-playwright-tests.git

      # 7️⃣ Install Playwright dependencies
      - name: Install Playwright Dependencies
        run: |
          cd nifty-playwright-tests
          npm install
          npx playwright install --with-deps
        shell: bash

      # 8️⃣ Run Playwright tests
      - name: Run Playwright Tests
        run: |
          cd nifty-playwright-tests
          npx playwright test --forbid-only
        shell: bash

      # 9️⃣ Upload Playwright report (if needed)
      - name: Upload Playwright Report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: nifty-playwright-tests/playwright-report/
      #