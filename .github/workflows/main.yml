name: Frontend CI with Playwright

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout frontend repo
      - name: Checkout Frontend Repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js (Vite requires Node 20+)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ Install frontend dependencies
      - name: Install Frontend Dependencies
        run: npm install

      # 4️⃣ Build frontend
      - name: Build Frontend
        run: npm run build

      # 5️⃣ Start frontend server in background and wait until ready
      - name: Start Frontend Server
        run: |
          npm run dev &         # start server in background
          npx wait-on http://localhost:5004 --timeout 120000
        shell: bash

      # 6️⃣ Clone Playwright test repo
      - name: Clone Playwright Test Repo
        run: git clone https://github.com/Anik-006/nifty-playwright-tests.git

      # 7️⃣ Install Playwright dependencies
      - name: Install Playwright Dependencies
        run: |
          cd nifty-playwright-tests
          npm install
          npx playwright install --with-deps
        shell: bash

      # 8️⃣ Run Playwright tests
      - name: Run Playwright Tests
        run: |
          cd nifty-playwright-tests
          npx playwright test --forbid-only
        shell: bash
